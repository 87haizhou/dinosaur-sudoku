<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>恐龙数独乐园</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#8B7355;--primary-dark:#6B5335;--secondary:#2C5F2D;--secondary-dark:#1A3A1A;
--accent:#FFB347;--success:#4A7C59;--warning:#CC0000;--danger:#8B0000;
--bg1:#1A1A1A;--bg2:#2C2C2C;--bg3:#3A3A3A;--surface:#2A2A2A;
--text1:#D4A574;--text2:#B8B8B8;--shadow:rgba(0,0,0,0.5);
}
body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#0a0f0a 0%,#1a2a1a 30%,#0d1a0d 60%,#1a1a1a 100%);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-80px;right:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,230,180,0.06) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0}

/* === 星空背景 === */
.pbg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.pbg .p{position:absolute;border-radius:50%;animation:pf linear infinite}
@keyframes pf{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

/* === 萤火虫效果 === */
.cbg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.cbg svg{position:absolute;opacity:0.08;animation:cd linear infinite}
@keyframes cd{0%{transform:translateX(-400px)}100%{transform:translateX(calc(100vw + 400px))}}

/* === 容器 === */
.wrap{max-width:540px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* === 头部 === */
.hdr{text-align:center;margin-bottom:28px;position:relative}
.logow{position:relative;display:inline-block}
.logog{position:absolute;width:220px;height:220px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,179,71,0.12) 0%,transparent 70%);border-radius:50%;animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.3);opacity:.8}}
.logo{font-family:'Fredoka One',cursive;font-size:2.5rem;background:linear-gradient(135deg,#FFB347 0%,#D4A574 40%,#8B7355 70%,#4A7C59 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.5)) text-shadow:0 0 20px rgba(255,179,71,0.3)}

/* === 模式卡片 === */
.msel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.mcard{background:var(--surface);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 10px 40px var(--shadow);border:2px solid rgba(139,115,85,0.3);position:relative;overflow:hidden}
.mcard::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(139,115,85,0.1),rgba(44,95,45,0.1));opacity:0;transition:opacity 0.3s}
.mcard:hover::before{opacity:1}
.mcard::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,179,71,0.15),transparent);transition:left 0.6s}
.mcard:hover::after{left:100%}
.mcard:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.mcard.active{border-color:var(--accent);transform:translateY(-4px) scale(1.02);box-shadow:0 15px 50px rgba(255,179,71,0.2)}
.mcard.active::before{opacity:1}
.mimg{width:68px;height:68px;border-radius:12px;object-fit:cover;box-shadow:0 4px 15px rgba(0,0,0,0.3);margin-bottom:8px;border:1px solid rgba(139,115,85,0.3)}
.mcard div[style]{font-size:2.6rem;margin-bottom:8px}
.mt{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--text1);margin-bottom:3px}
.md{font-size:0.78rem;color:var(--text2);font-weight:600}

/* === 难度标签 === */
.dtabs{display:flex;gap:10px;margin-bottom:24px;background:var(--surface);padding:8px;border-radius:12px;box-shadow:0 10px 40px var(--shadow);border:1px solid rgba(139,115,85,0.2)}
.tab{flex:1;padding:14px 8px;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);background:transparent;color:var(--text2);position:relative;overflow:hidden}
.tab.active-easy{background:linear-gradient(135deg,#4A7C59,#2C5F2D);color:#fff;box-shadow:0 6px 25px rgba(74,124,89,0.35)}
.tab.active-medium{background:linear-gradient(135deg,#8B7355,#6B5335);color:#fff;box-shadow:0 6px 25px rgba(139,115,85,0.35)}
.tab.active-hard{background:linear-gradient(135deg,#CC0000,#8B0000);color:#fff;box-shadow:0 6px 25px rgba(204,0,0,0.35)}

/* === 关卡区域 === */
.lsec{background:var(--surface);border-radius:16px;padding:28px;box-shadow:0 15px 60px var(--shadow);margin-bottom:24px;position:relative;overflow:hidden;border:1px solid rgba(139,115,85,0.15)}
.lsec::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:linear-gradient(135deg,var(--accent),transparent);border-radius:50%;opacity:0.08}
.shdr{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sicon{width:52px;height:52px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 6px 20px rgba(0,0,0,0.3);animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.stitle{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--text1);line-height:1.3}
.sSUB{font-size:0.86rem;color:var(--text2);font-weight:600}

.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ch_lb{grid-column:span 4;display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.ch_badge{background:linear-gradient(135deg,#2C5F2D,#1A3A1A);border:1px solid rgba(139,115,85,0.5);color:#D4A574;font-size:0.9rem;padding:6px 16px;border-radius:8px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ch_badge::before{content:'🌍';font-size:1rem}
.ch_desc{font-size:0.72rem;color:rgba(212,165,116,0.7);font-weight:600;padding-left:2px;margin-bottom:1px}
.ch_line{flex:1;height:2px;background:linear-gradient(90deg,rgba(139,115,85,0.4),transparent);border-radius:2px}

.lbtn{aspect-ratio:1;border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:1.3rem;cursor:pointer;transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;overflow:hidden}
.lbtn::before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,0.08),transparent);border-radius:10px;pointer-events:none}
.lbtn.unlocked{background:linear-gradient(145deg,#3A3A3A 0%,#2A2A2A 100%);color:var(--text1);box-shadow:0 8px 30px rgba(0,0,0,0.3);border:1px solid rgba(139,115,85,0.3)}
.lbtn.unlocked:hover{transform:translateY(-6px) scale(1.1);box-shadow:0 15px 50px rgba(255,179,71,0.15)}
.lbtn.completed{background:linear-gradient(145deg,var(--success),#2C5F2D);color:#fff;border:1px solid rgba(74,124,89,0.3)}
.lbtn.locked{background:linear-gradient(145deg,#222,#2a2a2a);color:#555;cursor:not-allowed;border:1px solid rgba(255,255,255,0.05)}
.lbtn.current::after{content:'';position:absolute;inset:-4px;border:3px solid var(--accent);border-radius:14px;animation:cpu 1.2s ease-in-out infinite}
@keyframes cpu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.06)}}
.lstars{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:0.5rem;letter-spacing:-3px;z-index:2}

/* === 收藏区 === */
.csec{background:var(--surface);border-radius:16px;padding:28px;box-shadow:0 15px 60px var(--shadow);position:relative;overflow:hidden;border:1px solid rgba(139,115,85,0.15)}
.csec::after{content:'';position:absolute;bottom:-40px;left:-40px;width:140px;height:140px;background:linear-gradient(135deg,var(--secondary),transparent);border-radius:50%;opacity:0.08}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chleft{display:flex;align-items:center;gap:14px}
.cicon{width:50px;height:50px;background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.ch3 fh3{font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--text1)}
.ccount{font-size:0.86rem;color:var(--text2);font-weight:600}
.cbadge{background:linear-gradient(135deg,var(--accent),#CC8A2E);color:#1A1A1A;padding:8px 18px;border-radius:8px;font-weight:800;font-size:0.88rem;box-shadow:0 4px 15px rgba(255,179,71,0.2)}
.agrid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.acard{width:64px;height:80px;background:linear-gradient(145deg,#333,#2a2a2a);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 25px rgba(0,0,0,0.3);transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;overflow:hidden;border:1px solid rgba(139,115,85,0.15)}
.acard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));transform:scaleX(0);transition:transform 0.3s}
.acard:not(.locked):hover{transform:translateY(-6px) scale(1.08);box-shadow:0 12px 40px rgba(255,179,71,0.15)}
.acard:not(.locked):hover::before{transform:scaleX(1)}
.acard.locked{filter:grayscale(1) brightness(0.5);opacity:0.35}
.dimg{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.08));transition:transform 0.3s}
.acard:not(.locked):hover .dimg{animation:dw 0.6s ease}
@keyframes dw{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(6deg) scale(1.05)}}
.dname{font-size:0.6rem;color:var(--text2);font-weight:700;text-align:center;line-height:1.2}
.pwarp{margin-top:20px}
.plabel{display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.86rem;color:var(--text2);font-weight:600}
.pbar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);border:1px solid rgba(139,115,85,0.15)}
.pfill{height:100%;background:linear-gradient(90deg,var(--success) 0%,var(--secondary) 50%,var(--primary) 100%);border-radius:6px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);position:relative}
.pfill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.35) 50%,transparent 100%);animation:psh 2s infinite}
@keyframes psh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* === 游戏界面 === */
.gscreen{display:none;animation:si 0.5s cubic-bezier(0.175,0.885,0.32,1.275)}
.gscreen.active{display:block}
@keyframes si{0%{opacity:0;transform:scale(0.9) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}

.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.nbtn{width:50px;height:50px;border:none;border-radius:12px;background:var(--surface);font-size:1.4rem;cursor:pointer;box-shadow:0 8px 30px var(--shadow);transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);display:flex;align-items:center;justify-content:center;border:1px solid rgba(139,115,85,0.2)}
.nbtn:hover{transform:scale(1.1) rotate(-5deg);box-shadow:0 15px 50px rgba(255,179,71,0.15)}
.ginfo{text-align:center;flex:1;margin:0 14px}
.ginfo h2{font-family:'Fredoka One',cursive;font-size:1.4rem;background:linear-gradient(135deg,var(--accent),var(--text1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gstats{display:flex;justify-content:center;gap:18px;font-size:0.9rem;color:var(--text2);font-weight:600;margin-top:4px}

/* === 棋盘 === */
.bcont{background:var(--surface);border-radius:16px;padding:20px;box-shadow:0 20px 80px rgba(0,0,0,0.4);margin-bottom:20px;position:relative;overflow:hidden;border:1px solid rgba(139,115,85,0.15)}
.bglow{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at center,rgba(255,179,71,0.03) 0%,transparent 60%);pointer-events:none}
.bgrid{display:grid;gap:2px;background:#1a1a1a;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.3);position:relative;z-index:1}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:1.5rem;cursor:pointer;transition:all 0.2s ease;background:#2a2a2a;color:var(--text2);position:relative}
.cell:hover:not(.fixed):not(.selected){background:#3a3a3a;transform:scale(1.05);z-index:1}
.cell.fixed{background:linear-gradient(145deg,#333,#2a2a2a);color:var(--text1);cursor:default;font-weight:800}
.cell.selected{background:linear-gradient(145deg,#4A3A2A,#3A2A1A)!important;transform:scale(1.1)!important;z-index:3!important;box-shadow:0 0 0 2px var(--accent),0 8px 25px rgba(255,179,71,0.3)!important;border-radius:8px;color:var(--accent)!important}
.cell.highlight{background:#333}
.cell.samenum{background:linear-gradient(145deg,#3A3020,#302A1A)}
.cell.error{animation:errs 0.5s ease;background:#4A1A1A!important}
@keyframes errs{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.cell.correctfill{animation:cpop 0.5s ease}
@keyframes cpop{0%{transform:scale(1)}30%{transform:scale(1.3);background:#2C5F2D}60%{transform:scale(0.95)}100%{transform:scale(1)}}
.diimg{width:80%;height:80%;object-fit:contain;animation:da 0.3s ease}
@keyframes da{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* === 控制面板 === */
.cpan{background:var(--surface);border-radius:16px;padding:22px;box-shadow:0 15px 60px var(--shadow);border:1px solid rgba(139,115,85,0.15)}
.msw{display:flex;gap:10px;margin-bottom:16px}
.mbt{flex:1;padding:12px;border:2px solid rgba(139,115,85,0.3);border-radius:10px;background:transparent;color:var(--text2);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.94rem;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;justify-content:center;gap:6px}
.mbt.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-color:var(--accent);color:#fff;box-shadow:0 8px 30px rgba(139,115,85,0.3)}

.npad{display:grid;gap:10px}
.nbtn2{height:54px;border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:1.45rem;cursor:pointer;transition:all 0.2s cubic-bezier(0.175,0.885,0.32,1.275);background:linear-gradient(145deg,#3a3a3a 0%,#2a2a2a 100%);color:var(--text1);box-shadow:0 5px 20px rgba(0,0,0,0.3);position:relative;overflow:hidden;border:1px solid rgba(139,115,85,0.15)}
.nbtn2::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent);border-radius:10px 10px 0 0}
.nbtn2::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,179,71,0.15);border-radius:50%;transform:translate(-50%,-50%);transition:width 0.4s,height 0.4s;opacity:0.4}
.nbtn2:hover::after{width:120%;height:120%}
.nbtn2:hover{transform:translateY(-4px);box-shadow:0 10px 35px rgba(255,179,71,0.12);border-color:rgba(255,179,71,0.3)}
.nbtn2:active{transform:scale(0.92)!important}
.nbtn2 .di2{width:65%;height:65%;object-fit:contain}
.nbtn2.clearbtn{background:linear-gradient(145deg,#3A1A1A,#2A1515);color:var(--danger);border:1px solid rgba(139,0,0,0.3)}

.arow{display:flex;gap:12px;margin-top:14px}
.abtn{flex:1;padding:14px;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.94rem;cursor:pointer;transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);display:flex;align-items:center;justify-content:center;gap:8px}
.abtn:hover{transform:translateY(-3px)}
.abtn:active{transform:scale(0.95)!important}
.abtn.undo{background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));color:#fff;box-shadow:0 4px 15px rgba(44,95,45,0.3)}
.abtn.hint{background:linear-gradient(135deg,var(--accent),#CC8A2E);color:#1A1A1A;box-shadow:0 4px 15px rgba(255,179,71,0.2)}
.abtn.restart{background:linear-gradient(135deg,#8B0000,#5A0000);color:#fff;box-shadow:0 4px 15px rgba(139,0,0,0.3)}

/* === 弹窗 === */
.mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.mask.active{display:flex;animation:oi 0.4s ease}
@keyframes oi{from{opacity:0}to{opacity:1}}
.winm{background:var(--surface);border-radius:20px;padding:32px 28px;max-width:400px;width:100%;text-align:center;position:relative;overflow:hidden;animation:mb 0.7s cubic-bezier(0.175,0.885,0.32,1.275);border:1px solid rgba(139,115,85,0.2)}
@keyframes mb{0%{transform:scale(0) rotate(-15deg);opacity:0}50%{transform:scale(1.08) rotate(5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
.mhdr{position:relative;z-index:1}
.mbadge{display:inline-block;background:linear-gradient(135deg,var(--accent),#CC8A2E);color:#1A1A1A;padding:8px 22px;border-radius:10px;font-weight:800;font-size:0.92rem;margin-bottom:14px;box-shadow:0 4px 15px rgba(255,179,71,0.25)}
.mtitle{font-family:'Fredoka One',cursive;font-size:2.2rem;background:linear-gradient(135deg,var(--accent),var(--text1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.msub{color:var(--text2);font-size:1rem;font-weight:600}
.scont{font-size:3rem;margin:20px 0;display:flex;justify-content:center;gap:10px}
.star{display:inline-block;animation:sp 0.5s ease both}
.star.empty{filter:grayscale(1);opacity:0.22}
@keyframes sp{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.35) rotate(15deg)}100%{transform:scale(1) rotate(0deg)}}
.rbox{background:linear-gradient(135deg,#2a2a1a,#1a2a1a);border-radius:16px;padding:24px;margin:20px 0;position:relative;border:1px solid rgba(139,115,85,0.2)}
.rlabel{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;color:var(--accent);font-weight:700;font-size:0.98rem}
.rdino{width:110px;height:110px;object-fit:contain;animation:rb 1.2s ease infinite;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.5))}
@keyframes rb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.06)}}
.rname{font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--text1);margin-top:8px}
.macts{display:flex;gap:14px;margin-top:24px}
.mbtn{flex:1;padding:15px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);display:flex;align-items:center;justify-content:center;gap:8px}
.mbtn:hover{transform:translateY(-4px)}
.mbtn:active{transform:scale(0.92)!important}
.mbtn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 8px 30px rgba(139,115,85,0.3)}
.mbtn.secondary{background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));color:#fff;box-shadow:0 8px 30px rgba(44,95,45,0.3)}

/* 彩带 */
.ccont{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.cp{position:absolute;width:12px;height:12px;animation:cf 3s ease forwards}

const Snd = (() => {

    if (ok) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ok = true; } catch(e) {}
  };

      o.start(t); o.stop(t + d);

let PROG = loadProg();

// ===== 进度 =====
function loadProg() {
  try {
    const d = localStorage.getItem('sudoku_v5');
    if (d) return JSON.parse(d);
  } catch (e) {}
  return mkProg();
}

function saveProg() {
  localStorage.setItem('sudoku_v5', JSON.stringify(PROG));
}

function mkProg() {
  const p = {};
  [4, 6, 9].forEach(m => {
    p[m] = {};
    ['easy', 'medium', 'hard'].forEach(d => {
      p[m][d] = { unlocked: 1, completed: [], stars: {} };
    });
  });
  return p;
}

// ===== 背景 =====
function mkParts() {
  const bg = document.getElementById('pbg');
  bg.innerHTML = '';
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const s = 1 + Math.random() * 3;
    p.style.cssText = `width:${s}px;height:${s}px;background:#fff;left:${Math.random() * 100}%;top:${Math.random() * 100}%;border-radius:50%;position:absolute;animation:twinkle ${2 + Math.random() * 4}s ease-in-out infinite;animation-delay:-${Math.random() * 5}s;opacity:${0.2 + Math.random() * 0.5}`;
    bg.appendChild(p);
  }
}

function mkClouds() {
  const bg = document.getElementById('cbg');
  bg.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    c.setAttribute('viewBox', '0 0 120 50');
    c.style.cssText = `width:${60 + Math.random() * 80}px;height:${20 + Math.random() * 30}px;top:${10 + Math.random() * 70}%;animation-duration:${30 + Math.random() * 25}s;animation-delay:-${Math.random() * 25}s`;
    c.innerHTML = '<ellipse cx="60" cy="35" rx="55" ry="20" fill="#2C5F2D" opacity="0.15"/><ellipse cx="40" cy="25" rx="25" ry="25" fill="#1A3A1A" opacity="0.1"/><ellipse cx="80" cy="28" rx="20" ry="18" fill="#2C5F2D" opacity="0.12"/>';
    bg.appendChild(c);
  }
}

// ===== 渲染关卡 =====
function renderLv() {
  const d = PROG[S.mode][S.diff];
  let h = '';
  const colCount = S.mode === 4 ? 5 : S.mode === 6 ? 5 : 5;
  
  const EPOCHS_PER_DIFF = 4; // 4 epochs per 20-level difficulty
  const LVS_PER_EPOCH = 5;  // 5 levels per epoch within each diff
  
  for (let i = 1; i <= LEVELS_PER_DIFF; i++) {
    if ((i - 1) % LVS_PER_EPOCH === 0) {
      const localEpochIdx = Math.floor((i - 1) / LVS_PER_EPOCH);
      // Global epoch index: each mode has 3 diffs × 4 epochs = 12 epochs total per mode
      const modeOrder = {4: 0, 6: 1, 9: 2};
      const diffOrder = {easy: 0, medium: 1, hard: 2};
      const globalEpochIdx = modeOrder[S.mode] * 12 + diffOrder[S.diff] * EPOCHS_PER_DIFF + localEpochIdx;
      const epoch = GEOLOGICAL_EPOCHS[globalEpochIdx % GEOLOGICAL_EPOCHS.length];
      h += `<div style="grid-column:span ${colCount};display:flex;flex-direction:column;gap:2px;margin:${i > 1 ? '14px' : '4px'} 0 4px">
        <span class="ch_badge" title="${epoch.time}">${epoch.icon} ${epoch.period}·${epoch.epoch}</span>
        <span class="ch_desc">${epoch.era} · ${epoch.desc}</span>
        <span class="ch_line"></span>
      </div>`;
    }
    const unl = i <= d.unlocked;
    const comp = d.completed.includes(i);
    const stars = d.stars[i] || 0;
    let cls = 'lbtn';
    if (comp) cls += ' completed';
    else if (unl) cls += ' unlocked';
    else cls += ' locked';
    if (i === d.unlocked) cls += ' current';
    const onclickAttr = unl ? `onclick="stLv(${i})"` : '';
    const dinoIdx = getGlobalDinoIdx(S.mode, S.diff, i);
    const dino = DINOSAUR_DB[dinoIdx % DINOSAUR_DB.length];
    const levelIcon = unl ? dino.emoji : '🔒';
    h += `<button class="${cls}" ${onclickAttr}>${levelIcon}${comp ? '<span class="lstars">' + '⭐'.repeat(stars) + '</span>' : ''}</button>`;
  }
  document.getElementById('lgrid').innerHTML = h;
  document.getElementById('stitle').textContent = MNAME[S.mode] + ' · ' + DNAME[S.diff];
  document.getElementById('ssub').textContent = '共' + TOTAL_LEVELS + '关 · 探索地球生命史诗';
  const modeIcon = S.mode === 4 ? '🐟' : S.mode === 6 ? '🦕' : '🦖';
  document.getElementById('modeIcon').textContent = modeIcon;
  // Update grid columns based on mode
  document.getElementById('lgrid').style.gridTemplateColumns = 'repeat(' + colCount + ',1fr)';
}

// Get global dino index from mode/diff/level
function getGlobalDinoIdx(mode, diff, lv) {
  const modeOrder = {4: 0, 6: 1, 9: 2};
  const diffOrder = {easy: 0, medium: 1, hard: 2};
  return (modeOrder[mode] * 60) + (diffOrder[diff] * LEVELS_PER_DIFF) + (lv - 1);
}

// ===== 渲染收藏 =====
function renderCol() {
  let uc = 0;
  [4, 6, 9].forEach(m => {
    ['easy', 'medium', 'hard'].forEach(d => {
      uc += PROG[m][d].completed.length;
    });
  });
  uc = Math.min(uc, TOTAL_LEVELS);
  const totalDinos = DINOSAUR_DB.length;
  let h = '';
  for (let i = 0; i < TOTAL_LEVELS; i++) {
    const unl = i < uc;
    const dino = DINOSAUR_DB[i % totalDinos];
    let content = '';
    if (unl) {
      if (dino.img) {
        content = `<img class="dimg" src="${dino.img}" alt="${dino.name}" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='block'">
        <div style="display:none;font-size:1.7rem">${dino.emoji}</div>`;
      } else {
        content = `<div style="font-size:1.8rem">${dino.emoji}</div>`;
      }
    } else {
      content = `<div style="font-size:1.7rem;opacity:0.3">❓</div>`;
    }
    h += `<div class="acard ${unl ? '' : 'locked'}" title="${unl ? (dino.desc || dino.name) : '???'}">
      ${content}
      <span class="dname">${unl ? dino.name : '???'}</span>
    </div>`;
  }
  document.getElementById('agrid').innerHTML = h;
  const pct = Math.round(uc / TOTAL_LEVELS * 100);
  document.getElementById('ccount').textContent = '已收集 ' + uc + '/' + TOTAL_LEVELS + ' 种古生物';
  document.getElementById('cbadge').textContent = pct + '%';
  document.getElementById('ppct').textContent = pct + '%';
  document.getElementById('pfill').style.width = pct + '%';
  const cicon = document.getElementById('cicon');
  if (cicon) {
    if (uc >= 120) cicon.textContent = '🦖';
    else if (uc >= 60) cicon.textContent = '🦕';
    else cicon.textContent = '🦐';
  }
}

// ===== 渲染棋盘 =====
function renderBoard() {
  const g = document.getElementById('bgrid');
  const sz = S.mode, bs = Math.round(Math.sqrt(sz));
  g.style.gridTemplateColumns = 'repeat(' + sz + ',1fr)';
  let h = '';
  for (let i = 0; i < sz; i++) {
    for (let j = 0; j < sz; j++) {
      const v = S.board[i][j], isF = S.fixed[i][j];
      let disp = '';
      if (v !== 0) {
        if (S.imode === 'dino') {
          const dinoIdx = (v - 1) % DINOSAUR_DB.length;
          const dino = DINOSAUR_DB[dinoIdx];
          if (dino.img) {
            disp = `<img class="diimg" src="${dino.img}" onerror="this.onerror=null;this.style.display='none';this.nextSibling.style.display='inline';"><span style="display:none;font-size:1.5rem">${dino.emoji}</span>`;
          } else {
            disp = `<span style="font-size:1.5rem">${dino.emoji}</span>`;
          }
        } else disp = v;
      }
      let cls = 'cell';
      if (isF) cls += ' fixed';
      if ((j + 1) % bs === 0 && j < sz - 1) cls += ' border-right';
      if ((i + 1) % bs === 0 && i < sz - 1) cls += ' border-bottom';
      h += `<div class="${cls}" data-r="${i}" data-c="${j}" onclick="selCell(${i},${j})">${disp}</div>`;
    }
  }
  g.innerHTML = h;
}

function renderPad() {
  const p = document.getElementById('npad');
  const sz = S.mode;
  p.innerHTML = '';
  p.style.gridTemplateColumns = 'repeat(' + sz + ',1fr)';
  for (let i = 1; i <= sz; i++) {
    let disp;
    if (S.imode === 'dino') {
      const dinoIdx = (i - 1) % DINOSAUR_DB.length;
      const dino = DINOSAUR_DB[dinoIdx];
      if (dino.img) {
        disp = `<img class="di2" src="${dino.img}" onerror="this.onerror=null;this.style.display='none';this.nextSibling.style.display='inline';"><span style="display:none;font-size:1.3rem">${dino.emoji}</span>`;
      } else {
        disp = `<span style="font-size:1.3rem">${dino.emoji}</span>`;
      }
    } else disp = i;
    p.innerHTML += `<button class="nbtn2" onclick="inpNum(${i})">${disp}</button>`;
  }
  p.innerHTML += `<button class="nbtn2 clearbtn" onclick="inpNum(0)">✖️</button>`;
}

// ===== 游戏控制 =====
function smode(m) {
  Snd.init();
  Snd.play('click');
  S.mode = m;
  document.querySelectorAll('.mcard').forEach(c => c.classList.toggle('active', +c.dataset.m === m));
  renderLv();
}

function sdiff(el) {
  Snd.init();
  Snd.play('click');
  document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
  el.classList.add('active-' + el.dataset.d);
  S.diff = el.dataset.d;
  renderLv();
}

function stLv(lv) {
  Snd.init();
  Snd.play('select');
  S.lv = lv;
  S.hints = 0;
  S.hist = [];
  S.tmr = 0;
  S.started = false;
  S.sel = null;
  if (S.tid) clearInterval(S.tid);
  
  // Load level from pre-generated LEVELS data
  const levelData = LEVELS[S.mode][S.diff][lv - 1];
  if (!levelData) {
    showT('关卡数据加载失败');
    return;
  }
  const board = levelData.board.map(r => [...r]);
  const solution = levelData.solution.map(r => [...r]);
  
  S.board = board;
  S.sol = solution;
  S.fixed = board.map(r => r.map(c => c !== 0));
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.add('active');
  const epochIdx = Math.floor((lv - 1) / LEVELS_PER_EPOCH) % GEOLOGICAL_EPOCHS.length;
  const epoch = GEOLOGICAL_EPOCHS[epochIdx];
  const dinoIdx = getGlobalDinoIdx(S.mode, S.diff, lv);
  const dino = DINOSAUR_DB[dinoIdx % DINOSAUR_DB.length];
  document.getElementById('gtitle').textContent = MNAME[S.mode] + ' · ' + DNAME[S.diff] + ' 第' + lv + '关';
  document.getElementById('gstats').innerHTML = '<span>⏱️ <span id="timer">00:00</span></span><span>💡 <span id="hcnt">0</span></span><span style="color:rgba(212,165,116,0.6);font-size:0.75rem">🌍 ' + epoch.icon + ' ' + epoch.period + ' · ' + epoch.era + '</span>';
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('hcnt').textContent = '0';
  renderBoard();
  renderPad();
}

function selCell(r, c) {
  Snd.play('select');
  document.querySelectorAll('.cell').forEach(cl => cl.classList.remove('selected', 'highlight', 'samenum'));
  const idx = r * S.mode + c;
  document.querySelectorAll('.cell')[idx].classList.add('selected');
  S.sel = { r, c };
  const bs = Math.round(Math.sqrt(S.mode)), bsr = Math.floor(r / bs) * bs, bsc = Math.floor(c / bs);
  const val = S.board[r][c];
  document.querySelectorAll('.cell').forEach((cl, i) => {
    const rr = Math.floor(i / S.mode), cc = i % S.mode;
    if (rr === r || cc === c) cl.classList.add('highlight');
    if (rr >= bsr && rr < bsr + bs && cc >= bsc && cc < bsc + bs) cl.classList.add('highlight');
    if (val !== 0 && S.board[rr][cc] === val) cl.classList.add('samenum');
  });
}

function inpNum(num) {
  if (!S.sel) { showT('请先选择一个格子'); return; }
  if (!S.started) { S.started = true; startT(); }
  const { r, c } = S.sel;
  if (S.fixed[r][c]) return;
  S.hist.push({ r, c, old: S.board[r][c] });
  S.board[r][c] = num;
  if (num !== 0 && num !== S.sol[r][c]) {
    Snd.play('error');
    const idx = r * S.mode + c;
    const cl = document.querySelectorAll('.cell')[idx];
    cl.classList.add('error');
    setTimeout(() => cl.classList.remove('error'), 400);
  } else if (num !== 0) Snd.play('input');
  renderBoard();
  if (S.sel) selCell(S.sel.r, S.sel.c);
  if (checkW()) win();
}

function checkW() {
  const s = S.mode;
  for (let i = 0; i < s; i++) {
    for (let j = 0; j < s; j++) {
      if (S.board[i][j] !== S.sol[i][j]) return false;
    }
  }
  return true;
}

function win() {
  stopT();
  Snd.play('win');
  const time = S.tmr, hints = S.hints;
  let stars = 3;
  if (time > 120) stars = 2;
  if (time > 240 || hints > 2) stars = 1;
  const d = PROG[S.mode][S.diff];
  if (!d.completed.includes(S.lv)) d.completed.push(S.lv);
  d.stars[S.lv] = Math.max(d.stars[S.lv] || 0, stars);
  if (S.lv < LEVELS_PER_DIFF && d.unlocked <= S.lv) d.unlocked = S.lv + 1;
  saveProg();
  // 星星
  const sc = document.getElementById('scont');
  sc.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('span');
    s.className = 'star ' + (i < stars ? '' : 'empty');
    s.textContent = '⭐';
    s.style.animationDelay = i * 0.2 + 's';
    sc.appendChild(s);
  }
  // 奖励古生物 - 每关解锁一个
  const rb = document.getElementById('rbox');
  const dinoIdx = getGlobalDinoIdx(S.mode, S.diff, S.lv);
  const dino = DINOSAUR_DB[dinoIdx % DINOSAUR_DB.length];
  document.getElementById('rbox').innerHTML = `
    <div class="rlabel"><span>🎁</span><span>新古生物解锁</span><span>🎁</span></div>
    <div style="font-size:4rem;margin:10px 0">${dino.img ? '' : dino.emoji}</div>
    ${dino.img ? `<img class="rdino" src="${dino.img}" alt="${dino.name}" onerror="this.style.display='none';this.previousElementSibling.style.display='block'">` : ''}
    <p class="rname">${dino.name}</p>
    <p style="font-size:0.7rem;color:rgba(212,165,116,0.6);margin-top:4px">${dino.desc || ''}</p>
  `;
  rb.style.display = 'block';
  mkConfetti();
  document.getElementById('winMask').classList.add('active');
}

function mkConfetti() {
  const c = document.getElementById('ccont');
  c.innerHTML = '';
  const cs = ['#8B7355', '#2C5F2D', '#FFB347', '#4A7C59', '#D4A574', '#CC0000'];
  const sh = ['50%', '2px'];
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = cs[Math.floor(Math.random() * cs.length)];
    p.style.borderRadius = sh[Math.floor(Math.random() * sh.length)];
    p.style.animationDelay = Math.random() * 2 + 's';
    p.style.animationDuration = 2 + Math.random() * 2 + 's';
    c.appendChild(p);
    setTimeout(() => p.remove(), 5000);
  }
}

function nextLv() {
  Snd.play('click');
  document.getElementById('winMask').classList.remove('active');
  if (S.lv < LEVELS_PER_DIFF) stLv(S.lv + 1);
  else { showT('🎉 恭喜通关本难度全部关卡！'); goHome(); }
}

function goHome() {
  Snd.play('click');
  document.getElementById('winMask').classList.remove('active');
  document.getElementById('game').classList.remove('active');
  document.getElementById('home').classList.remove('hidden');
  stopT();
  renderLv();
  renderCol();
}

function setMode(m) {
  Snd.play('click');
  S.imode = m;
  document.getElementById('mbt_num').classList.toggle('active', m === 'num');
  document.getElementById('mbt_dino').classList.toggle('active', m === 'dino');
  renderBoard();
  renderPad();
}

function doUndo() {
  if (!S.hist.length) { showT('没有可撤销的操作'); return; }
  Snd.play('undo');
  const lst = S.hist.pop();
  S.board[lst.r][lst.c] = lst.old;
  renderBoard();
  if (S.sel) selCell(S.sel.r, S.sel.c);
}

function doRestart() {
  if (confirm('确定要重置本关吗？')) {
    Snd.play('click');
    stLv(S.lv);
  }
}

function doHint() {
  if (!S.sel) { showT('请先选择一个空格'); return; }
  const { r, c } = S.sel;
  if (S.fixed[r][c]) { showT('这是固定数字'); return; }
  Snd.play('hint');
  S.board[r][c] = S.sol[r][c];
  S.hints++;
  document.getElementById('hcnt').textContent = S.hints;
  renderBoard();
  if (S.sel) selCell(r, c);
  if (checkW()) win();
}

// ===== 计时 =====
function startT() {
  S.tid = setInterval(() => {
    S.tmr++;
    const m = String(Math.floor(S.tmr / 60)).padStart(2, '0');
    const s = String(S.tmr % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);
}

function stopT() {
  if (S.tid) { clearInterval(S.tid); S.tid = null; }
}

function showT(msg) {
  Snd.play('error');
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== 初始化 =====
function init() {
  mkParts();
  mkClouds();
  renderLv();
  renderCol();
}
init();
</script>
</body>
